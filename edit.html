<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Luna · Menu editor</title>
<style>
  :root { --teal:#567C8D; --navy:#2F4156; --beige:#F5EFEB; --line:#D9D6D0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Helvetica Neue", Arial, sans-serif; font-size:15px; color:var(--navy); background:var(--beige); }
  .top { height:56px; background:var(--navy); color:var(--beige); display:flex; align-items:center; padding:0 20px; justify-content:space-between; position:sticky; top:0; z-index:5; }
  .top b { font-family: Georgia, serif; font-size:20px; letter-spacing:.04em; font-weight:normal; }
  .top span { font-size:13px; opacity:.85; }
  .app { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:0; padding-bottom:84px; }
  .form { padding:24px 20px; max-width:720px; width:100%; margin:0 auto; }
  .prev { border-left:1px solid var(--line); position:sticky; top:56px; height:calc(100vh - 56px - 72px); background:#fff; }
  .prev .cap { font-size:12px; letter-spacing:.16em; text-transform:uppercase; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--beige); }
  .prev iframe { width:100%; height:calc(100% - 33px); border:0; }
  h2 { font-family: Georgia, serif; font-weight:normal; font-size:22px; margin:32px 0 12px; }
  h2:first-child { margin-top:0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:14px; }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; }
  .card-head strong { font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
  .f { display:block; margin-bottom:10px; }
  .f > span { display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; opacity:.8; }
  input[type=text], textarea { width:100%; padding:9px 10px; border:1px solid #bdb8b0; border-radius:4px; font:inherit; color:inherit; background:#fff; }
  input[type=text]:focus, textarea:focus { outline:2px solid var(--teal); border-color:var(--teal); }
  textarea { min-height:64px; resize:vertical; }
  .row { display:flex; gap:10px; align-items:flex-end; }
  .row > * { flex:1; }
  .row > .x { flex:0 0 auto; }
  .mode { display:flex; gap:20px; margin:6px 0 12px; }
  .mode label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .als { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:4px 12px; margin-top:4px; }
  .als label { display:flex; gap:6px; align-items:center; font-size:14px; cursor:pointer; }
  button { font:inherit; cursor:pointer; border-radius:4px; border:1px solid var(--navy); background:#fff; color:var(--navy); padding:7px 12px; }
  button:hover { background:var(--beige); }
  button.small { padding:4px 9px; font-size:13px; }
  button.danger { border-color:#a33; color:#a33; }
  button.add { border-style:dashed; width:100%; margin-top:4px; }
  .hint { font-size:13px; opacity:.75; margin:-4px 0 12px; }
  .savebar { position:fixed; left:0; right:0; bottom:0; height:72px; background:var(--navy); color:var(--beige); display:flex; align-items:center; gap:14px; padding:0 20px; z-index:6; }
  .savebar .msg { flex:1; font-size:13px; line-height:1.4; }
  .savebar button { background:var(--beige); border-color:var(--beige); font-weight:600; padding:10px 18px; }
  .savebar button.sec { background:transparent; color:var(--beige); font-weight:400; }
  .status { font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  .status.dirty { color:#F2C879; }
  #banner { background:#F2E3B8; color:var(--navy); padding:12px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #d8c78f; }
  #banner[hidden] { display:none; }
  .app.locked .form { opacity:.45; pointer-events:none; user-select:none; }
  #banner span { flex:1; min-width:240px; }
  #banner button { font-weight:600; }
  details.card > summary { cursor:pointer; font-weight:600; letter-spacing:.04em; }
  .grp { font-size:12px; letter-spacing:.16em; text-transform:uppercase; margin:20px 0 8px; padding-top:12px; border-top:1px solid var(--line); }
  .grp:first-of-type { border-top:0; padding-top:0; }
  .sub { background:var(--beige); }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .prev { position:static; height:640px; border-left:0; border-top:1px solid var(--line); }
    .savebar { height:auto; padding:10px 14px; flex-wrap:wrap; }
    .savebar .msg { flex:1 1 100%; }
  }
</style>
</head>
<body>

<div class="top"><b>Luna · Menu editor</b><span id="status" class="status">No changes yet</span></div>

<div id="banner" hidden></div>

<div class="app">
  <div class="form" id="form"></div>
  <div class="prev"><div class="cap">Live preview</div><iframe id="pv" src="index.html" title="Preview"></iframe></div>
</div>

<div class="savebar">
  <div class="msg"><b>To publish:</b> press <i>Copy menu.js</i>, open <code>menu.js</code> on GitHub, click the pencil, select all, paste, then "Commit changes". The page updates in about a minute. Nothing here changes your live page until you do that.</div>
  <button class="sec" id="dl">Download</button>
  <button id="copy">Copy menu.js</button>
</div>

<script src="menu.js"></script>
<script>
(function () {
  const ALLERGENS = ["Gluten","Crustaceans","Eggs","Fish","Peanuts","Soy","Milk","Nuts","Celery","Mustard","Sesame","Sulphites","Lupin","Molluscs"];
  const DEFAULT_TEXT = {
    brand: "Luna",
    heroSub: "Amsterdam",
    menuLink: "View the menu",
    menuLabel: "The menu",
    menuHeading: "What I bake",
    allergenLabel: "Contains",
    orderLabel: "How to order",
    orderHeading: "Simple and personal",
    steps: [
      { title: "Send a message", text: "Tell me what you'd like and when you'd like to collect it, by WhatsApp or email." },
      { title: "I confirm", text: "I'll reply to confirm availability, the total and a pickup time." },
      { title: "Collect your bakes", text: "Pick up from me, or ask for delivery." }
    ],
    contactLabel: "Order",
    contactHeading: "Get in touch",
    contactIntro: "The quickest way to order is a message. The button below opens WhatsApp with a ready-made note.",
    whatsappButton: "Order on WhatsApp",
    emailPrompt: "Prefer email?",
    footerNote: "Everything is baked in a home kitchen where gluten, milk, eggs, nuts and soy are handled. Please tell me about any allergies when you order.",
    footerLine: "Luna · Made at home",
    pageTitle: "Luna — Small-batch bakes",
    pageDescription: "Luna: small-batch bakes made at home in Amsterdam. See the menu and order by WhatsApp or email."
  };
  function mergeText(t) {
    t = t || {};
    const out = JSON.parse(JSON.stringify(DEFAULT_TEXT));
    Object.keys(DEFAULT_TEXT).forEach(k => {
      if (k === "steps") {
        if (Array.isArray(t.steps) && t.steps.length) out.steps = t.steps.map(s => ({ title: String(s.title ?? ""), text: String(s.text ?? "") }));
      } else if (typeof t[k] === "string" && t[k].trim()) out[k] = t[k];
    });
    return out;
  }
  const D = JSON.parse(JSON.stringify(LUNA));
  D.text = mergeText(LUNA.text);
  let lastSpecial = null, dirty = false, textOpen = false;

  // ---- Draft autosave (this browser only) ----
  const KEY = "luna-menu-editor-draft:" + location.pathname;
  let draftOK = true, pending = false;
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (_) { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); draftOK = true; } catch (_) { draftOK = false; } },
    del() { try { localStorage.removeItem(KEY); } catch (_) {} }
  };
  const validDraft = d => d && d.data && Array.isArray(d.data.menu) && Array.isArray(d.data.orderInfo) && d.data.contact && typeof d.data.contact === "object";

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const get = p => p.split(".").reduce((o, k) => o[k], D);
  const set = (p, v) => { const ks = p.split("."), last = ks.pop(); ks.reduce((o, k) => o[k], D)[last] = v; };

  const field = (label, path, val, extra = "") =>
    `<label class="f"><span>${label}</span><input type="text" data-p="${path}" value="${esc(val)}" ${extra}></label>`;

  const area = (label, path, val) =>
    `<label class="f"><span>${label}</span><textarea data-p="${path}">${esc(val)}</textarea></label>`;

  function textSection() {
    const t = D.text;
    return `
      <h2>Page text</h2>
      <details class="card" id="textd" ${textOpen ? "open" : ""}>
        <summary>Edit headings, intro text, steps and footer</summary>
        <div class="grp">Top of the page</div>
        ${field("Wordmark (large name)", "text.brand", t.brand)}
        ${field("Small line below the wordmark", "text.heroSub", t.heroSub)}
        ${field("Link below it", "text.menuLink", t.menuLink)}
        <div class="grp">Menu section</div>
        ${field("Small label", "text.menuLabel", t.menuLabel)}
        ${field("Heading", "text.menuHeading", t.menuHeading)}
        ${field("Allergen label (before the list)", "text.allergenLabel", t.allergenLabel)}
        <div class="grp">How-to-order section</div>
        ${field("Small label", "text.orderLabel", t.orderLabel)}
        ${field("Heading", "text.orderHeading", t.orderHeading)}
        ${t.steps.map((s, i) => `
          <div class="card sub">
            <div class="card-head"><strong>Step ${i + 1}</strong>
              <button class="small danger" data-act="del-step" data-i="${i}" ${t.steps.length < 2 ? "disabled" : ""}>Remove</button></div>
            ${field("Title", `text.steps.${i}.title`, s.title)}
            ${area("Text", `text.steps.${i}.text`, s.text)}
          </div>`).join("")}
        <button class="add small" data-act="add-step">+ Add a step</button>
        <div class="grp">Contact section</div>
        ${field("Small label", "text.contactLabel", t.contactLabel)}
        ${field("Heading", "text.contactHeading", t.contactHeading)}
        ${area("Intro sentence", "text.contactIntro", t.contactIntro)}
        ${field("WhatsApp button text", "text.whatsappButton", t.whatsappButton)}
        ${field("Text before the email link", "text.emailPrompt", t.emailPrompt)}
        <div class="grp">Footer</div>
        ${area("Allergen note", "text.footerNote", t.footerNote)}
        ${field("Bottom line", "text.footerLine", t.footerLine)}
        <div class="grp">Browser tab</div>
        ${field("Tab title", "text.pageTitle", t.pageTitle)}
        ${field("Page description", "text.pageDescription", t.pageDescription)}
        <p class="hint">Link previews in WhatsApp and search results read the original text inside index.html, so changing the title or description here changes the tab title only.</p>
        <p class="hint">A field left empty falls back to the built-in wording.</p>
      </details>`;
  }

  function itemHtml(it, base, kind) {
    const multi = Array.isArray(it.options);
    const allNames = [...ALLERGENS, ...(it.allergens || []).filter(a => !ALLERGENS.includes(a))];

    const price = multi
      ? `${it.options.map((o, j) => `
          <div class="row">
            ${field("Size", `${base}.options.${j}.size`, o.size)}
            ${field("Price", `${base}.options.${j}.price`, o.price)}
            <div class="x"><button class="small danger" data-act="del-size" data-base="${base}" data-j="${j}" title="Remove size" ${it.options.length < 2 ? "disabled" : ""}>✕</button></div>
          </div>`).join("")}
         <button class="add small" data-act="add-size" data-base="${base}">+ Add a size</button>`
      : `<div class="row">${field("Price", `${base}.price`, it.price)}${field("Unit (e.g. each, box of 6)", `${base}.unit`, it.unit)}</div>`;

    return `
      ${kind === "special" ? field("Heading above the name", `${base}.label`, it.label) : ""}
      ${field("Name", `${base}.name`, it.name)}
      <div class="row" style="align-items:center">
        <label class="f" style="display:flex;gap:8px;align-items:center;cursor:pointer;margin:0"><input type="checkbox" data-un="${base}" ${it.unavailable ? "checked" : ""}> Mark as unavailable</label>
        ${field("Stamp text (default: Unavailable)", `${base}.stampText`, it.stampText, 'placeholder="Unavailable"')}
      </div>
      <label class="f"><span>Description</span><textarea data-p="${base}.desc">${esc(it.desc)}</textarea></label>
      ${kind === "item" ? field("Photo file name (optional, e.g. tiramisu.jpg)", `${base}.photo`, it.photo) : ""}
      <div class="mode">
        <label><input type="radio" name="mode-${base}" data-act="mode" data-base="${base}" value="single" ${multi ? "" : "checked"}> One price</label>
        <label><input type="radio" name="mode-${base}" data-act="mode" data-base="${base}" value="sizes" ${multi ? "checked" : ""}> Several sizes</label>
      </div>
      ${price}
      <div class="f" style="margin-top:12px"><span>Allergens</span>
        <div class="als">${allNames.map(a => `<label><input type="checkbox" data-al="${base}" value="${esc(a)}" ${(it.allergens || []).includes(a) ? "checked" : ""}> ${esc(a)}</label>`).join("")}</div>
      </div>`;
  }

  function build() {
    const c = D.contact;
    $("form").innerHTML = `
      <h2>Menu items</h2>
      ${D.menu.map((it, i) => `
        <div class="card">
          <div class="card-head"><strong>Item ${i + 1}</strong>
            <span>
              <button class="small" data-act="up" data-i="${i}" ${i === 0 ? "disabled" : ""}>↑</button>
              <button class="small" data-act="down" data-i="${i}" ${i === D.menu.length - 1 ? "disabled" : ""}>↓</button>
              <button class="small danger" data-act="del-item" data-i="${i}">Remove</button>
            </span></div>
          ${itemHtml(it, `menu.${i}`, "item")}
        </div>`).join("")}
      <button class="add" data-act="add-item">+ Add an item</button>

      <h2>Weekly special</h2>
      <div class="card">
        <label class="f" style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" data-act="special-on" ${D.special ? "checked" : ""}> Show a weekly special</label>
        ${D.special ? itemHtml(D.special, "special", "special") : `<p class="hint">Hidden on the page.</p>`}
      </div>

      <h2>Order information</h2>
      <div class="card">
        ${D.orderInfo.map((r, i) => `
          <div class="row">${field("Label", `orderInfo.${i}.0`, r[0])}${field("Text", `orderInfo.${i}.1`, r[1])}
          <div class="x"><button class="small danger" data-act="del-info" data-i="${i}" title="Remove">✕</button></div></div>`).join("")}
        <button class="add small" data-act="add-info">+ Add a line</button>
      </div>

      <h2>Contact</h2>
      <div class="card">
        ${field("WhatsApp number (country code + number, digits only)", "contact.whatsapp", c.whatsapp)}
        ${field("Email", "contact.email", c.email)}
        ${field("Pre-filled WhatsApp message", "contact.whatsappMessage", c.whatsappMessage)}
      </div>
      ${textSection()}`;
    preview();
  }

  function code(src = D) {
    const out = JSON.parse(JSON.stringify(src));
    out.contact.whatsapp = String(out.contact.whatsapp).replace(/\D/g, "");
    const fix = it => { if (!it) return; if (Array.isArray(it.options)) { delete it.price; delete it.unit; } else { delete it.options; } };
    out.menu.forEach(fix); fix(out.special);
    const clean = it => { if (!it) return; if (!it.unavailable) delete it.unavailable; if (!(it.stampText || "").trim()) delete it.stampText; };
    out.menu.forEach(clean); clean(out.special);
    return "/* Luna menu data. Generated by edit.html. You can also edit it by hand. */\n\nconst LUNA = " + JSON.stringify(out, null, 2) + ";\n";
  }

  let loaded = false;
  $("pv").addEventListener("load", () => { loaded = true; preview(); });
  function preview() {
    if (loaded) $("pv").contentWindow.postMessage({ type: "luna-preview", data: JSON.parse(code().split("const LUNA = ")[1].replace(/;\s*$/, "")) }, "*");
  }
  function touch() {
    dirty = true;
    if (!pending) store.set({ savedAt: Date.now(), data: D });   // never overwrite an unanswered draft
    $("status").textContent = draftOK
      ? "Unsaved changes · draft kept in this browser · copy menu.js when done"
      : "Unsaved changes: copy menu.js when done (draft can't be kept in this browser)";
    $("status").className = "status dirty";
    preview();
  }

  const form = $("form");
  form.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.p) { set(t.dataset.p, t.value); touch(); }
  });

  form.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.un) {
      const it = get(t.dataset.un);
      if (t.checked) it.unavailable = true; else delete it.unavailable;
      touch();
    } else if (t.dataset.al) {
      const it = get(t.dataset.al), list = it.allergens || (it.allergens = []);
      const order = [...ALLERGENS, ...list.filter(a => !ALLERGENS.includes(a))];
      const has = new Set(list);
      t.checked ? has.add(t.value) : has.delete(t.value);
      it.allergens = order.filter(a => has.has(a));
      touch();
    } else if (t.dataset.act === "mode") {
      const it = get(t.dataset.base);
      if (t.value === "sizes" && !Array.isArray(it.options)) {
        it.options = [{ size: it.unit || "", price: it.price || "" }]; delete it.unit; delete it.price;
      } else if (t.value === "single" && Array.isArray(it.options)) {
        const f = it.options[0] || {}; it.unit = f.size || "each"; it.price = f.price || ""; delete it.options;
      }
      build(); touch();
    } else if (t.dataset.act === "special-on") {
      if (t.checked) D.special = lastSpecial || { label: "This week's special", name: "", unit: "each", price: "", desc: "", allergens: [] };
      else { lastSpecial = D.special; D.special = null; }
      build(); touch();
    }
  });

  form.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const a = b.dataset.act, i = +b.dataset.i;
    if (a === "add-item") D.menu.push({ name: "New item", desc: "", unit: "each", price: "", allergens: [], photo: "" });
    else if (a === "del-item") { if (!confirm("Remove this item?")) return; D.menu.splice(i, 1); }
    else if (a === "up" || a === "down") { const j = a === "up" ? i - 1 : i + 1; [D.menu[i], D.menu[j]] = [D.menu[j], D.menu[i]]; }
    else if (a === "add-size") { const it = get(b.dataset.base); it.options.push({ size: "", price: "" }); }
    else if (a === "del-size") { get(b.dataset.base).options.splice(+b.dataset.j, 1); }
    else if (a === "add-step") D.text.steps.push({ title: "", text: "" });
    else if (a === "del-step") D.text.steps.splice(i, 1);
    else if (a === "add-info") D.orderInfo.push(["", ""]);
    else if (a === "del-info") D.orderInfo.splice(i, 1);
    else return;
    build(); touch();
  });

  form.addEventListener("toggle", e => { if (e.target.id === "textd") textOpen = e.target.open; }, true);

  $("copy").addEventListener("click", async () => {
    const text = code(), btn = $("copy");
    try { await navigator.clipboard.writeText(text); }
    catch (_) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = "Copy menu.js", 2000);
  });

  $("dl").addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([code()], { type: "text/javascript" }));
    const a = document.createElement("a"); a.href = url; a.download = "menu.js"; a.click(); URL.revokeObjectURL(url);
  });

  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  // Offer to restore an earlier draft that differs from the current menu.js
  const baseline = code();
  const draft = store.get();
  if (validDraft(draft)) {
    const d = JSON.parse(JSON.stringify(draft.data));
    d.text = mergeText(d.text);
    if (code(d) === baseline) store.del();               // already published: nothing to restore
    else {
      const when = new Date(draft.savedAt || Date.now()).toLocaleString();
      const bn = $("banner");
      bn.innerHTML = `<span><b>You have unsaved edits</b> from ${esc(when)} that are not in your current menu.js.</span>
        <button id="restore">Restore my edits</button><button id="discard">Discard them</button>`;
      bn.hidden = false; pending = true; document.querySelector(".app").classList.add("locked");
      const unlock = () => { pending = false; bn.hidden = true; document.querySelector(".app").classList.remove("locked"); };
      $("restore").addEventListener("click", () => {
        Object.keys(D).forEach(k => delete D[k]);
        Object.assign(D, d);
        unlock(); build(); touch();
      });
      $("discard").addEventListener("click", () => {
        if (!confirm("Discard your unsaved edits for good?")) return;
        store.del(); unlock();
      });
    }
  } else if (draft) store.del();                          // unreadable draft

  build();
})();
</script>
</body>
</html>
